backend:
  name: github
  repo: Nacchanman/kuruhitimes
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "data"
    label: "くるひもCMS"
    files:
      - file: "data.json"
        label: "サイトデータ"
        name: "site"
        format: "json"

        fields:
          - label: "サイト設定"
            name: "site"
            widget: "object"
            fields:
              - { label: "天気", name: "weather", widget: "string" }
              - { label: "開始日", name: "startDate", widget: "string" }

          - label: "あしたのアイデア"
            name: "ideas"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "例: idea-21。他の記事と重複しないIDにしてください。" }
              - { label: "サムネイル画像", name: "image", widget: "image", required: false, hint: "ホーム画面では小さな画像として表示され、記事ページでは大きく表示されます。" }
              - { label: "カテゴリ", name: "category", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "要約", name: "summary", widget: "text" }
              - { label: "タグ", name: "tag", widget: "string" }
              - { label: "公開日", name: "publishDate", widget: "string", hint: "例: 2026-05-02" }
              - { label: "読了時間", name: "readTime", widget: "string", hint: "例: 5分" }
              - { label: "本文", name: "body", widget: "text" }

          - label: "きょうのクオート"
            name: "quotes"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "例: quote-001。他のクオートと重複しないIDにしてください。" }
              - { label: "引用文", name: "quote", widget: "text" }
              - { label: "人物名", name: "author", widget: "string" }
              - { label: "出典", name: "source", widget: "string", required: false }
              - { label: "公開日", name: "publishDate", widget: "string", hint: "例: 2026-05-02" }
              - { label: "編集長の所感", name: "editorNote", widget: "text" }

          - label: "きょうのランチ"
            name: "lunches"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "例: lunch-001。他のランチ記事と重複しないIDにしてください。" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "お店・場所", name: "place", widget: "string", required: false }
              - { label: "公開日", name: "publishDate", widget: "string", hint: "例: 2026-05-03" }
              - { label: "要約", name: "summary", widget: "text" }
              - { label: "カバー画像", name: "coverImage", widget: "image", required: false, hint: "未設定の場合は写真リストの1枚目が使われます。" }
              - label: "写真"
                name: "photos"
                widget: "list"
                required: false
                add_to_top: false
                fields:
                  - { label: "写真", name: "image", widget: "image" }
                  - { label: "キャプション", name: "caption", widget: "string", required: false }
              - { label: "本文", name: "body", widget: "text", hint: "本文中の好きな場所に [[photo:1]]、[[photo:2]] のように書くと、その番号の写真が挿入されます。指定しなかった写真は本文末尾にまとめて表示されます。" }

          - label: "note連携"
            name: "noteConfig"
            widget: "object"
            fields:
              - { label: "noteユーザー名", name: "username", widget: "string" }
              - { label: "表示件数", name: "displayCount", widget: "number", value_type: "int", min: 1, max: 6 }

          - label: "beehiiv連携"
            name: "beehiivConfig"
            widget: "object"
            fields:
              - { label: "Publication URL", name: "publicationUrl", widget: "string" }

          - label: "X投稿"
            name: "xPostsConfig"
            widget: "object"
            fields:
              - { label: "アカウントURL", name: "accountUrl", widget: "string" }
              - label: "投稿URL"
                name: "postUrls"
                widget: "list"
                field:
                  label: "URL"
                  name: "url"
                  widget: "string"
