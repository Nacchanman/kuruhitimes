backend:
  name: github
  repo: Nacchanman/kuruhitimes
  branch: main
  auth_type: pkce

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "data"
    label: "くるひもCMS"
    files:
      - file: "data.json"
        label: "サイトデータ"
        name: "site"
        format: "json"

        fields:
          - label: "サイト設定"
            name: "site"
            widget: "object"
            fields:
              - { label: "天気", name: "weather", widget: "string" }
              - { label: "開始日", name: "startDate", widget: "string" }

          - label: "アイデア"
            name: "ideas"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "カテゴリ", name: "category", widget: "string" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "要約", name: "summary", widget: "text" }
              - { label: "タグ", name: "tag", widget: "string" }
              - { label: "公開日", name: "publishDate", widget: "string" }
              - { label: "読了時間", name: "readTime", widget: "string" }
              - { label: "本文", name: "body", widget: "text" }

          - label: "X投稿"
            name: "xPostsConfig"
            widget: "object"
            fields:
              - label: "投稿URL"
                name: "postUrls"
                widget: "list"
                field:
                  label: "URL"
                  name: "url"
                  widget: "string"
